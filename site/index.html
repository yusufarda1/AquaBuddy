<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaBuddy – Uygulamayı İndir</title>
  <meta name="description" content="AquaBuddy uygulamasını telefonunuza yükleyin.">
  <meta name="theme-color" content="#667eea">
  <link rel="canonical" href="https://app.aquabuddy.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AquaBuddy – Uygulamayı İndir">
  <meta property="og:description" content="AquaBuddy uygulamasını telefonunuza yükleyin.">
  <meta property="og:url" content="https://app.aquabuddy.com/">
  <meta property="og:image" content="https://app.aquabuddy.com/og.png">
  <style>
    :root{--g:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center}
    .card{background:rgba(255,255,255,.12);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:28px;max-width:560px;width:92%;text-align:center}
    h1{font-size:28px;margin-bottom:10px}
    p{opacity:.95;line-height:1.6}
    .cta{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .btn{appearance:none;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .btn-primary{background:#111;color:#fff}
    .btn-install{background:#fff;color:#333}
    footer{margin-top:16px;opacity:.9;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <h1>AquaBuddy</h1>
    <p>Uygulamayı telefonunuza kurmak için aşağıdaki bağlantıyı açın veya kurulum butonunu kullanın.</p>
    <div class="cta">
      <a class="btn btn-primary" id="open-app" href="/app/" rel="noopener">Uygulamayı Aç</a>
      <button class="btn btn-install" id="install">Uygulamayı İndir</button>
    </div>
    <footer>Android: Kurulum istemi görünür. iOS: Paylaş > Ana Ekrana Ekle.</footer>
  </main>
  <script>
    (function(){
      var deferred=null;
      document.getElementById('open-app').addEventListener('click',function(e){ /* noop */ });
      window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; });
      document.getElementById('install').addEventListener('click', async function(){
        if(!deferred){
          alert('Android için Chrome kullanın; iOS için Ana Ekrana Ekle menüsünü kullanın.');
          return;
        }
        deferred.prompt();
        try{ await deferred.userChoice }catch(e){}
        deferred=null;
      });
    })();
  </script>
</body>
</html>
